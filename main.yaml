openapi: "3.0.0"

info:
  title: Hello World
  version: "1.0"
servers:
  - url: /openapi
paths:
  /greeting/{name}:
    post:
      operationId: app.post_greeting
      responses:
        200:
          description: "Greeting response"
          content:
            text/plain:
              schema:
                type: string
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string